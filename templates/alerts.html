<!DOCTYPE html>
<html>

<head>

<title>Alerts</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='style.css') }}">

</head>

<body>

<div class="header">

<h1>Alerts Dashboard</h1>

</div>

<table>

<tr>

<th>Vendor</th>
<th>Contract End Date</th>

</tr>

{% for vendor in vendors %}

<tr>

<td>{{ vendor.vendor_name }}</td>

<td>{{ vendor.contract_end_date }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
